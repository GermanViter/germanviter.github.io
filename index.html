<!doctype html>
<html lang="en" data-theme="mocha">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>German Viter · IT student and Linux ricer</title>
    <meta
      name="description"
      content="Portfolio of German Viter, an IT student at Cégep Marie-Victorin in Montréal who lives in the terminal: projects, dotfiles and experience."
    />
    <meta name="theme-color" content="#1e1e2e" />
    <meta property="og:title" content="German Viter · IT student and Linux ricer" />
    <meta
      property="og:description"
      content="IT student in Montréal who lives in the terminal. Projects, dotfiles and experience."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <script>
      // Apply the saved theme before first paint ('flavor' is the old storage key).
      try {
        var theme = localStorage.getItem('theme') || localStorage.getItem('flavor')
        var known = ['mocha', 'macchiato', 'frappe', 'latte', 'gruvbox-dark', 'gruvbox-light', 'tokyo-night']
        if (known.indexOf(theme) !== -1) document.documentElement.dataset.theme = theme
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
